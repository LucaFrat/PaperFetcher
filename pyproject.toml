[project]
name = "paperfatcher"
version = "0.1.0"
description = "Nightly arXiv -> podcast pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.26",
    "requests>=2.32",
    "elevenlabs>=1.10.0",
    "pymupdf>=1.24.0",
    "edge-tts>=6.1.10",
]

[project.scripts]
paperfatcher = "paperfatcher.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperfatcher"]
